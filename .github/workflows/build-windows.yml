name: Build Windows Desktop

# 在 GitHub 的 Windows runner 上编译 GUI，产出可下载的 exe。
# 本地是 Linux 也能编出 Windows 程序。

on:
  workflow_dispatch:            # 手动触发（推荐）
  push:
    paths:
      - 'custom/**'
      - '.github/workflows/build-windows.yml'

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 40

    env:
      # Windows 控制台默认 cp1252，脚本里的中文会触发 UnicodeEncodeError
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: '1'

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 缓存 pip
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\pip\Cache
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt', 'pyproject.toml') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install pywebview pyinstaller
          # 完整安装：让 PyInstaller 能把运行时依赖一起收进包里
          pip install -e .
        shell: pwsh

      - name: 生成运行时配置
        run: |
          # 预生成 settings 骨架，避免用户首次运行报错
          python -c "from deeptutor.services.setup.init import init_user_directories; init_user_directories(); print('settings OK')"
          python -c "import custom.gui.backend as b; print('backend OK')"
        shell: pwsh

      - name: 验证导入
        run: |
          python -c "import webview; print('pywebview OK')"
          python -c "import deeptutor; print('deeptutor OK')"
          python -c "import custom.vision.enhance as v; print('vision OK')"
        shell: pwsh

      - name: 编译 exe
        run: python custom/gui/build.py
        shell: pwsh

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: DeepTutor-Assistant-Windows
          path: custom/gui/dist/
          retention-days: 30

      - name: 汇总
        run: |
          echo "## 编译完成" >> $env:GITHUB_STEP_SUMMARY
          Get-ChildItem custom/gui/dist -Recurse -File |
            Select-Object Name, @{N='MB';E={[math]::Round($_.Length/1MB,2)}} |
            Format-Table | Out-String | Add-Content $env:GITHUB_STEP_SUMMARY
        shell: pwsh
