# ============================================
# DeepTutor 试卷助手 · 源码构建版 Docker Compose
# 适用：新虚拟机直接 git clone 源码 + compose 构建部署
# ============================================
# 用法：
#   1) git clone https://github.com/<你的GitHub名>/DeepTutor.git
#   2) 把本文件放到克隆出的 DeepTutor 目录旁边（或任意目录），
#      并确认 deeptutor 服务的 context 指向源码目录
#   3) docker compose up -d --build
#
# 数据与模型都挂载到宿主机，容器重建不丢。
# 说明：deeptutor 服务改为 build（源码构建），不再拉远程镜像。
# ============================================

services:
  # ============================================
  # Redis —— turn 协调存储（多 worker / 悬挂 turn 自动恢复）
  # 启动前自动修正数据目录属主（redis 标准 UID 999），避免挂载目录
  # 属主异常导致 RDB 快照 Permission denied → MISCONF 只读保护。
  # ============================================
  redis:
    image: redis:7.4-alpine
    container_name: deeptutor-redis
    restart: unless-stopped
    command: ["sh", "-c", "chown -R 999:999 /data 2>/dev/null || true; exec redis-server --appendonly yes --appendfsync everysec"]
    volumes:
      - ./data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ============================================
  # Ollama —— 本地向量模型（bge-m3）的运行环境
  # ============================================
  ollama:
    image: ollama/ollama:latest
    container_name: deeptutor-ollama
    restart: unless-stopped

    volumes:
      # bge-m3 约 1.2GB，落在宿主机，重建容器不重下
      - ./models/ollama:/root/.ollama

    environment:
      # 必须监听 0.0.0.0，否则 deeptutor 容器连不上
      - OLLAMA_HOST=0.0.0.0:11434

    # 不映射到宿主机端口 —— 只给 deeptutor 内部用。
    # 需要在本机调试时再打开：
    # ports:
    #   - "11434:11434"

    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ============================================
  # DeepTutor 主服务（源码构建）
  # ============================================
  deeptutor:
    # 源码构建：context 指向克隆出来的源码目录
    # target=production → 3.3GB 生产镜像（默认 target 是 development 6.4GB，含开发工具，没必要）
    build:
      context: ./DeepTutor
      dockerfile: Dockerfile
      target: production
    image: deeptutor:local
    container_name: deeptutor
    restart: unless-stopped

    ports:
      # 宿主机端口 : 容器内前端端口
      - "${DEEPTUTOR_PORT:-3782}:3782"
      # 后端 API（可选，调试用）
      - "${DEEPTUTOR_API_PORT:-8001}:8001"

    volumes:
      # ① 业务数据 —— 必须挂载，且要定期备份
      #    知识库 / 配置 / 会话 / 题库
      - ./data:/app/data

      # ② MinerU 数据（独立 venv + 解析模型，约 2.8GB）
      #    只有选「全本地部署」才会用到，由开箱引导按需下载。
      - ./models/mineru:/app/data/.mineru

      # ③ 备份目录（备份脚本输出到这里，宿主机可见）
      - ./backups:/app/backups

    environment:
      # 指向容器内的 Ollama 服务
      OLLAMA_HOST_BASE: "http://ollama:11434"

      # 时区 —— 必须显式设置。官方镜像默认 UTC，会导致：
      #   · 界面与日志时间差 8 小时
      #   · AI 回答「今天几号」按 UTC 算，晚上会差一天
      TZ: "${DEEPTUTOR_TZ:-Asia/Shanghai}"

    depends_on:
      ollama:
        condition: service_healthy
      redis:
        condition: service_healthy

    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3782/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
